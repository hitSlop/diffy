[package]
name = "diffy"
version = "0.2.5"
edition = "2024"
description = "A small desktop Git diff viewer"
publish = false
default-run = "diffy"
license = "MIT"
repository = "https://github.com/hitSlop/diffy"

[features]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
agent-sessions = "=0.2.2"
octocrab = { version = "=0.54.5", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
cargo-packager-updater = { git = "https://github.com/crabnebula-dev/cargo-packager", rev = "0a3ea3a089363b7e77dfca238be5bbcf3f4d75f6" }
ignore = "=0.4.33"
notify = "=8.2.0"
nucleo-matcher = "=0.3.1"
async-channel = "=2.5.0"
directories = "=6.0.0"
fs2 = "=0.4.3"
interprocess = "=2.4.4"
tempfile = "3.27"
which = "8"
lru = "=0.18.5"
gix = { version = "=0.89.0", default-features = false, features = ["basic", "status", "sha1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "=0.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
url = "=2.5.8"
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-toml", "tree-sitter-markdown"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[build-dependencies]
embed-resource = "=3.0.11"

[[bin]]
name = "diffy"
path = "src/main.rs"

[[bin]]
name = "diffy-cli"
path = "src/terminal.rs"

[[bench]]
name = "performance"
harness = false

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "ui"
harness = false
required-features = ["ui-tests"]


[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[package.metadata.packager]
product-name = "Diffy"
identifier = "com.hitslop.diffy"
homepage = "https://github.com/hitSlop/diffy"
category = "DeveloperTool"
formats = ["app", "dmg"]
out-dir = "dist/unsigned"
before-packaging-command = "sh scripts/prepare-package.sh"
icons = ["target/packaging/Diffy.icns"]
resources = [
  { src = "LICENSE", target = "LICENSE.txt" },
  { src = "THIRD_PARTY_NOTICES.md", target = "Third-party-notices.md" },
  { src = "assets/fonts/LICENSE", target = "CommitMono-LICENSE.txt" },
  { src = "vendor/gpui-component/LICENSE-APACHE", target = "GPUI-Component-LICENSE.txt" },
  { src = "target/packaging/licenses", target = "licenses" },
]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "packaging/Info.plist"

[[test]]
name = "import_ui"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "performance_ui"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "project_menu_ui"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "worktrees_ui"
harness = false
required-features = ["ui-tests"]

[[test]]
name = "github_ui"
harness = false
required-features = ["ui-tests"]
